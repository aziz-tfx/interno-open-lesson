# Одноразовый воркфлоу: забирает портрет куратора из CDN и кладёт в репозиторий.
# Нужен потому, что у агента нет доступа к этому хосту. После того как файл
# приземлился, воркфлоу удаляется.
name: Fetch mentor portrait

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and optimise
        env:
          SRC: https://d8j0ntlcm91z4.cloudfront.net/user_3CLCviMVubl8pteTJQ9R4nBs27N/hf_20260903_200254_bc52c045-0656-48d5-a35f-9abf3c14dcb5.png
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/mentor.png "$SRC"
          file /tmp/mentor.png
          if command -v magick >/dev/null 2>&1; then IM="magick"; else
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            IM="convert"
          fi
          # Карточка .mentor__photo — 520px по высоте, retina 2x; 1040x1560 с запасом.
          "$IM" /tmp/mentor.png -resize 1040x1560^ -strip -interlace Plane -quality 82 mentor-asad.jpg
          ls -la mentor-asad.jpg
          identify mentor-asad.jpg || true

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mentor-asad.jpg
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Replace mentor portrait with brand-styled studio shot (downloaded by CI)"
            git push
          fi
