# Одноразовый workflow: скачивает 3D-иконку акции с CDN генератора и
# коммитит её в репозиторий (sandbox-прокси сессии не пускает к CDN).
# Удалить после того, как promo-gift-3d.png окажется в репо.
name: fetch-promo-asset
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download asset
        run: |
          curl -fL --retry 3 -o promo-gift-3d.png "https://d8j0ntlcm91z4.cloudfront.net/user_3CLCviMVubl8pteTJQ9R4nBs27N/hf_20260804_193016_07d4d1b0-fad2-498b-b727-8bf1fe89de52.png"
          file promo-gift-3d.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo-gift-3d.png
          git commit -m "Add promo gift 3D asset (downloaded by CI)"
          git push
