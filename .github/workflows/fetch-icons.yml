# Одноразовый workflow: скачивает сгенерированные 3D-иконки с CDN в icons-src/
# (sandbox-прокси сессии не пускает к CDN). Удалить после переноса в icons/.
name: fetch-icons
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download icons
        run: |
          mkdir -p icons-src
          B="https://d8j0ntlcm91z4.cloudfront.net/user_3CLCviMVubl8pteTJQ9R4nBs27N"
          curl -fL --retry 3 -o icons-src/guide.png     "$B/hf_20260804_194407_fb31283e-5277-4f33-bfb9-f963b757fd27.png"
          curl -fL --retry 3 -o icons-src/checklist.png "$B/hf_20260804_194409_ced38b3f-d335-477e-a3d6-935fa07e19a1.png"
          curl -fL --retry 3 -o icons-src/coupon.png    "$B/hf_20260804_194410_bf7d6169-c89b-4816-b346-fd6cb1ee905b.png"
          curl -fL --retry 3 -o icons-src/stopwatch.png "$B/hf_20260804_194411_92a03913-aa42-4191-9107-8c8a24f9252e.png"
          curl -fL --retry 3 -o icons-src/laptop.png    "$B/hf_20260804_194412_923908d0-cc51-41ba-9d22-6ee48b6269fa.png"
          curl -fL --retry 3 -o icons-src/money.png     "$B/hf_20260804_194413_404a06b8-180b-41fb-a1d2-dfde435676d3.png"
          curl -fL --retry 3 -o icons-src/bulb.png      "$B/hf_20260804_194414_b70596db-07ff-46d6-905c-ae8bd1632b2a.png"
          curl -fL --retry 3 -o icons-src/bolt.png      "$B/hf_20260804_194429_fa8e5ead-0d5b-4283-b7c7-9f20a6de45f0.png"
          file icons-src/*.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons-src
          git commit -m "Add generated 3D icon sources (downloaded by CI)"
          git push
